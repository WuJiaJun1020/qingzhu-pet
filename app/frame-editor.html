<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self'; connect-src 'none'"><title>透明帧修补 · 青竹桌宠</title><link rel="stylesheet" href="frame-editor.css"></head>
<body><header><h1>透明帧修补</h1><select id="character" aria-label="角色"></select><select id="action" aria-label="动画"></select><button id="save" class="primary" disabled>保存全部修改</button></header>
<div class="frame-row"><button id="prev">上一帧</button><input id="frame" type="range" min="0" max="1" value="0" aria-label="帧进度"><input id="frame-number" type="number" min="1" value="1" aria-label="帧编号"><span id="frame-total"></span><button id="next">下一帧</button></div>
<main><aside aria-label="修补工具">
<section class="group"><h2>修补工具</h2><div class="tool-grid"><button id="smart" class="active" title="点击自动取色，清除附近连通的相近颜色，可撤销">自动清除</button><button id="erase">清除像素</button><button id="restore">恢复像素</button></div><div class="fields"><label>识别半径<input id="white-radius" type="number" min="1" max="128" value="24" title="识别半径（原始像素）"></label><label>颜色容差<input id="white-tolerance" type="number" min="0" max="80" value="24"></label></div><p>点击自动取色，按容差清除附近连通颜色。<span class="sampled"><i id="color-swatch"></i><output id="picked-color">尚未取色</output></span></p></section>
<section class="group"><h2>像素笔刷</h2><div class="fields"><label>大小 · 像素<input id="brush" type="number" min="1" max="64" value="3"></label><label>强度 · %<input id="strength" type="number" min="1" max="100" value="100"></label></div><label class="check"><input id="soft" type="checkbox" checked>柔和边缘</label></section>
<section class="group"><div class="group-heading"><h2>清除后柔化</h2><select id="feather-radius" aria-label="柔化半径"><option value="1">1 像素</option><option value="2">2 像素</option><option value="3" selected>3 像素</option></select></div><div class="tools"><button id="feather">柔化当前帧</button><button id="batch-feather" title="统一柔化本次打开过的已修补帧；各帧可撤销">柔化本批帧</button></div></section>
<section class="group"><div class="tools"><button id="undo" disabled title="Ctrl + Z">撤销</button><button id="redo" disabled title="Ctrl + Shift + Z">重做</button><button id="reset" title="恢复到本次保存前的状态，可撤销">重置本帧</button></div></section>
<p class="help">← → 切帧 · Ctrl + S 统一保存<br>空格 / 中键拖动画布 · Ctrl + 滚轮缩放</p>
</aside><div class="workspace"><div class="canvas-toolbar"><label>缩放 <select id="zoom"><option value="1" selected>100%</option><option value="2">200%</option><option value="4">400%</option><option value="8">800%</option><option value="16">1600%</option><option value="32">3200%</option></select></label><label>背景 <select id="background"><option value="dark">深色</option><option value="checker">棋盘格</option><option value="light">浅色</option><option value="blue">蓝色</option></select></label><label class="check" title="左侧修改前，右侧修改后；拖动竖线查看差异"><input id="comparison" type="checkbox" checked>前后对比</label><button id="center" title="将当前缩放的画布移至视野中央">居中</button></div>
<div id="viewport" data-background="dark"><div id="surface"><div id="stage"><canvas id="after"></canvas><div id="before-clip"><canvas id="before"></canvas></div><span id="before-label">修改前</span><span id="after-label">修改后</span><div id="divider" role="slider" tabindex="0" aria-label="修改前后分隔线" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span>↔</span></div><div id="cursor" hidden></div></div></div></div></div></main>
<footer><div class="status-row"><span id="pixel">加载中…</span><span id="pending"></span></div><div class="status-row"><span id="saved" role="status">保存将直接写入人物帧；保存后以新帧为基准</span><span id="error" role="alert"></span></div></footer><dialog id="close-confirm"><h2>还有未保存的修补</h2><p>关闭会放弃本次未保存的修改。</p><div class="tools"><button id="continue-edit" autofocus>继续编辑</button><button id="discard-edit">放弃并关闭</button></div></dialog><script src="frame-brush.js"></script><script src="frame-editor.js"></script></body></html>
